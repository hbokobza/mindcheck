<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BilanPsy Pro — Bilan clinique</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',Arial,sans-serif;background:#F7F4EF;color:#211C16;min-height:100vh}
#page-content{max-width:900px;margin:0 auto;padding:24px 16px 60px}
.loading,.error-box{max-width:700px;margin:60px auto;text-align:center;padding:40px 20px}
.error-box{background:#FFF0EE;border:1px solid #FFCCC0;border-radius:8px;color:#C04A1A;font-size:15px}
.loading{color:#888}
@media print{
  *,*::before,*::after{-webkit-print-color-adjust:exact !important;print-color-adjust:exact !important}
  body{background:#F7F4EF}
  button{display:none !important}
  @page{margin:.4cm}
}
</style>
</head>
<body>

<div id="page-content">
  <div class="loading" id="loading">
    <div style="font-size:15px;margin-bottom:8px">Chargement du bilan…</div>
    <div style="font-size:12px;color:#aaa">Récupération des données cliniques</div>
  </div>
</div>

<script>
// sessionCode + baselineData globaux (utilises par les fonctions reprises de app.html)
let sessionCode = '';
let baselineData = null;

// Constantes globales reprises telles quelles de app.html (dependances de showBilanBTB)
const SCORE_META = {
  1: { label: "Fragile",    color: "#C0564A", bg: "#F1DED9" },
  2: { label: "En tension", color: "#C4892E", bg: "#F4E8CC" },
  3: { label: "Stable",     color: "#6E9A5C", bg: "#E3ECD9" },
  4: { label: "Solide",     color: "#2F6B43", bg: "#D6E4D3" }
};
function getScoreMeta(s){ return SCORE_META[Math.max(1,Math.min(4,Math.round(s)))] || {label:"—",color:"#CFC8BC",bg:"#F0EDE8"}; }
function scoreColor(s){ return getScoreMeta(s).color; }
function scoreLabel(s){ return getScoreMeta(s).label; }
function scoreBg(s){    return getScoreMeta(s).bg; }
// niv zones : le modèle envoie 0-1=vert, 2=jaune, 3=orange, 4=rouge → converti en score 1-4
function nivMeta(n){ const sc = n<=1?4:n===2?3:n===3?2:1; return getScoreMeta(sc); }
function nivColor(n){ return nivMeta(n).color; }
function nivLabel(n){ return nivMeta(n).label; }


const PSEE_PRO_LOGO_WHITE = `<img src="assets/logos/bilanpsy-pro-reserve.svg" alt="bilanpsy pro" style="height:34px;width:auto;display:block">`;


// ========================================================================
// FONCTIONS DE RENDU BTB — extraites telles quelles de app.html (showBilanBTB
// + printBilanBTB) pour un rendu IDENTIQUE au bilan de reference PS-YC8X-9Z4R.
// Seule adaptation : insertion dans #page-content au lieu d'une overlay modale.
// ========================================================================
function showBilanBTB(data){
  const date = new Date().toLocaleDateString('fr-FR');

  // ============================================================
  // SHOW BILAN BTB v3 WELLNESS SAFE
  // Architecture matchant la maquette V7 :
  // - Têtière bleu marine (identique V2)
  // - Scores psychométriques 3 cards horizontales (PHQ/GAD/PSS)
  //   avec alerte item 9 ambre (observationnelle, pas prescriptive)
  // - Synthèse clinique en card bleu très clair (pas marine plein)
  // - Cartographie radar + barres segmentées 6 axes
  // - Matrice psychosomatique 6 axes (manifestations + systèmes)
  // - Analyse linguistique implicite (5 sous-champs + observations)
  // - Mécanismes transdiagnostiques en cards compactes
  //   (avec boucle_courte symbolique)
  // - Points d'attention en grid 2x2 (4 thèmes + card item 9
  //   en pleine largeur si présent)
  // - Ressources observées en pleine largeur (intro + 3 cards)
  // - Méthodologie + Footer
  //
  // Compatibilité ascendante : si data contient encore les anciens
  // champs V2 (axes_therapeutiques, redflags, lecture_clinique),
  // ils sont ignorés silencieusement.
  // ============================================================

  // === HELPERS ===
  function getScoreMetaSafe(sc) {
    const safe = Math.max(1, Math.min(4, Math.round(sc || 2)));
    return { score: safe, ...SCORE_META[safe] };
  }

  function escapeHTML(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  // === SCORES PSYCHOMÉTRIQUES (CORRIGÉ V3.1) ===
  // data.indicateurs est un TABLEAU côté serveur (cf showBilan BtC),
  // pas un objet keyé par PHQ9/GAD7/PSS10.
  // Chaque entrée a la structure : {id, score, max, items_couverts, items_total, label, ...}
  const indicateurs = Array.isArray(data.indicateurs) ? data.indicateurs : [];

  // Métadonnées identiques à celles de showBilan BtC
  const PSYCHO_META_BTB = {
    PHQ9: {
      code: 'PHQ-9',
      name: 'Patient Health Questionnaire',
      periode: 'Sévérité dépressive · 14 derniers jours',
      thresholds: [
        { max: 4,  color: '#2F6B43', bg: '#E3ECD9', label: 'minimal' },
        { max: 9,  color: '#6E9A5C', bg: '#E3ECD9', label: 'léger' },
        { max: 14, color: '#C4892E', bg: '#F4E8CC', label: 'modéré' },
        { max: 19, color: '#C4892E', bg: '#F1DED9', label: 'modéré à sévère' },
        { max: 27, color: '#C0564A', bg: '#F1DED9', label: 'sévère' }
      ]
    },
    GAD7: {
      code: 'GAD-7',
      name: 'Generalized Anxiety Disorder Scale',
      periode: 'Anxiété généralisée · 14 derniers jours',
      thresholds: [
        { max: 4,  color: '#2F6B43', bg: '#E3ECD9', label: 'minimale' },
        { max: 9,  color: '#6E9A5C', bg: '#E3ECD9', label: 'légère' },
        { max: 14, color: '#C4892E', bg: '#F4E8CC', label: 'modérée' },
        { max: 21, color: '#C0564A', bg: '#F1DED9', label: 'sévère' }
      ]
    },
    PSS10: {
      code: 'PSS-10',
      name: 'Perceived Stress Scale',
      periode: 'Stress perçu · dernier mois',
      thresholds: [
        { max: 13, color: '#2F6B43', bg: '#E3ECD9', label: 'faible' },
        { max: 26, color: '#C4892E', bg: '#F4E8CC', label: 'modéré' },
        { max: 40, color: '#C0564A', bg: '#F1DED9', label: 'élevé' }
      ]
    }
  };

  function getBandBTB(moduleId, score) {
    const meta = PSYCHO_META_BTB[moduleId];
    if (!meta) return { color: '#8a897f', bg: '#f0eee9', label: '—' };
    return meta.thresholds.find(t => score <= t.max) || meta.thresholds[meta.thresholds.length - 1];
  }

  // Reconstitution d'un mapping {PHQ9, GAD7, PSS10} à partir du tableau
  const indMap = {};
  indicateurs.forEach(ind => { if (ind && ind.id) indMap[ind.id] = ind; });
  const phq = indMap.PHQ9;
  const gad = indMap.GAD7;
  const pss = indMap.PSS10;

  // Détection item 9 PHQ-9 (idéation suicidaire) - posture observationnelle wellness
  const item9Present = data.item9_present === true ||
    (phq && phq.itemScores && Number(phq.itemScores[8]) >= 1) ||
    (phq && phq.score != null && phq.score >= 15);

  const item9AlertHTML = item9Present ? `
    <div style="margin-top:10px;background:#fff7e0;border-left:4px solid #d8a24a;border-radius:6px;padding:9px 11px;color:#7c5a0f;font-size:11px;line-height:1.45">
      <b>Item 9 — point d'attention</b><br>
      Score ≥ 1 sur l'item relatif aux idées de mort ou d'auto-dommage. Observation à intégrer à votre lecture clinique.
    </div>` : '';

  // Card uniforme pour les 3 instruments — utilise les mêmes seuils colorés que le BtC
  function scorePsychoCardBTB(moduleId, ind, alertHTML) {
    const meta = PSYCHO_META_BTB[moduleId];
    if (!ind || ind.score == null) {
      return `<div style="padding:18px;border:1px dashed #d8d6cf;border-radius:14px;background:#fafaf7;color:#999;font-style:italic;font-size:12px;display:flex;flex-direction:column;gap:6px;min-height:130px;justify-content:center;text-align:center">
        <div style="color:#211C16;font-weight:800;font-style:normal;font-size:14px;font-family:Georgia,serif">${meta ? meta.code : moduleId}</div>
        <div>Non calculable<br><span style="font-size:10px">couverture insuffisante</span></div>
      </div>`;
    }
    const score = ind.score;
    const max = ind.max || meta.thresholds[meta.thresholds.length - 1].max;
    const band = getBandBTB(moduleId, score);
    const fillPct = Math.round((score / max) * 100);
    const itemsCovered = ind.items_couverts || 0;
    const itemsTotal = ind.items_total || 0;
    const isPartial = itemsTotal > 0 && itemsCovered < itemsTotal;
    const labelText = isPartial ? `${band.label} (estimation indicative)` : band.label;
    const couvNote = itemsTotal > 0 ? `${itemsCovered}/${itemsTotal} items couverts par le récit` : '';

    return `
      <div style="padding:18px 18px 16px;border:1px solid #e5e6e0;border-radius:14px;background:#fbfbfa;display:flex;flex-direction:column;gap:8px;min-height:130px">
        <div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start">
          <div style="flex:1;min-width:0">
            <div style="color:#211C16;font-weight:800;font-size:17px;font-family:Georgia,serif">${meta.code}</div>
            <div style="color:#666;font-size:11px;margin-top:1px">${escapeHTML(meta.name)}</div>
            <div style="color:#888;font-size:10px;margin-top:3px;font-style:italic">${escapeHTML(meta.periode)}</div>
          </div>
          <div style="color:#211C16;font-size:28px;font-weight:800;line-height:1;flex-shrink:0">${score}<span style="font-size:13px;color:#666;font-weight:600">/${max}</span></div>
        </div>
        <div style="height:7px;background:#eee;border-radius:999px;margin:4px 0;overflow:hidden">
          <div style="height:100%;background:${band.color};border-radius:999px;width:${fillPct}%"></div>
        </div>
        <span style="display:inline-block;padding:5px 11px;border-radius:999px;background:${band.bg};color:${band.color};font-weight:800;font-size:11px;align-self:flex-start">${escapeHTML(labelText)}</span>
        ${couvNote ? `<div style="font-size:10px;color:#888;font-style:italic;margin-top:2px">${escapeHTML(couvNote)}</div>` : ''}
        ${alertHTML || ''}
      </div>`;
  }

  const phqCard = scorePsychoCardBTB('PHQ9', phq, item9AlertHTML);
  const gadCard = scorePsychoCardBTB('GAD7', gad, '');
  const pssCard = scorePsychoCardBTB('PSS10', pss, '');

  // === SYNTHÈSE CLINIQUE EN BLEU CLAIR ===
  const syntheseHTML = `
    <section style="margin:24px 24px 0;padding:24px 28px;background:#EEF4F8;border:1px solid #D4E2EF;border-left:4px solid #EFE9DD;border-radius:18px">
      <div style="font-size:12px;letter-spacing:0.32em;color:#211C16;font-weight:800;text-transform:uppercase;margin-bottom:14px">Synthèse clinique &amp; orientation</div>
      <p style="font-family:Georgia,serif;font-style:italic;font-size:18px;line-height:1.55;margin:0;color:#1F2D38">${escapeHTML(data.synthese_clinique || data.synthese || '')}</p>
    </section>`;

  // === CARTOGRAPHIE + BARRES SEGMENTÉES PAR AXE ===
  // Radar SVG simple à 6 axes
  const axesArr = (data.axes || []).slice(0, 6);
  axesArr.forEach(ax => {
    if (ax && /processus psychiques/i.test(String(ax.label || ''))) {
      ax.label = 'Structure psychique et relationnelle';
    }
  });
  while (axesArr.length < 6) axesArr.push({ score: 2, label: '—', manifestations: '', systemes: '' });

  // Calcul des points du polygone (radar)
  function radarPoint(idx, score) {
    // 6 axes, angle = -90° + idx * 60° (en haut, sens horaire)
    const angle = (-90 + idx * 60) * Math.PI / 180;
    const r = (score / 4) * 100;
    return [Math.round(r * Math.cos(angle) * 100) / 100, Math.round(r * Math.sin(angle) * 100) / 100];
  }
  const radarPoints = axesArr.map((ax, i) => radarPoint(i, Math.max(1, Math.min(4, ax.score || 2))));
  const radarPolygon = radarPoints.map(p => p.join(',')).join(' ');
  const radarColors = axesArr.map(ax => {
    const s = Math.max(1, Math.min(4, Math.round(ax.score || 2)));
    return SCORE_META[s].color;
  });

  // SVG du radar (compact pour le grid) — viewBox élargi pour ne pas tronquer les labels
  const radarSVG = `
    <svg viewBox="-160 -135 320 280" width="240" height="220" aria-label="Radar" style="max-width:100%;height:auto">
      <polygon points="0,-100 86.6,-50 86.6,50 0,100 -86.6,50 -86.6,-50" fill="none" stroke="#dbcdb7" stroke-width="0.7"/>
      <polygon points="0,-66 57.2,-33 57.2,33 0,66 -57.2,33 -57.2,-33" fill="none" stroke="#e8ded0" stroke-width="0.7"/>
      <polygon points="0,-33 28.6,-16.5 28.6,16.5 0,33 -28.6,16.5 -28.6,-16.5" fill="none" stroke="#e8ded0" stroke-width="0.7"/>
      <line x1="0" y1="0" x2="0" y2="-100" stroke="#e8ded0" stroke-width="0.5"/>
      <line x1="0" y1="0" x2="86.6" y2="-50" stroke="#e8ded0" stroke-width="0.5"/>
      <line x1="0" y1="0" x2="86.6" y2="50" stroke="#e8ded0" stroke-width="0.5"/>
      <line x1="0" y1="0" x2="0" y2="100" stroke="#e8ded0" stroke-width="0.5"/>
      <line x1="0" y1="0" x2="-86.6" y2="50" stroke="#e8ded0" stroke-width="0.5"/>
      <line x1="0" y1="0" x2="-86.6" y2="-50" stroke="#e8ded0" stroke-width="0.5"/>
      <polygon points="${radarPolygon}" fill="rgba(31,58,77,0.18)" stroke="#211C16" stroke-width="2" stroke-linejoin="round"/>
      ${radarPoints.map((p, i) => `<circle cx="${p[0]}" cy="${p[1]}" r="6" fill="${radarColors[i]}"/>`).join('')}
      <g fill="#211C16" font-weight="800" font-size="10" font-family="Arial">
        <text x="0" y="-121" text-anchor="middle">Structure</text><text x="0" y="-109" text-anchor="middle">relationnelle</text>
        <text x="105" y="-55" text-anchor="start">Ressources</text>
        <text x="105" y="63" text-anchor="start">Comportements</text>
        <text x="0" y="125" text-anchor="middle">Régulation</text>
        <text x="-105" y="63" text-anchor="end">Corps</text>
        <text x="-105" y="-55" text-anchor="end">Environnement</text>
      </g>
    </svg>`;

  // Barres segmentées 6 axes (style maquette V7)
  const axesSegHTML = axesArr.map(ax => {
    const sc = Math.max(1, Math.min(4, Math.round(ax.score || 2)));
    const meta = getScoreMetaSafe(sc);
    // 4 segments : rouge / orange / vert clair / vert foncé
    const segColors = ['#d76f74', '#dfa24c', '#9cbe65', '#4f8a5b'];
    const segs = [1,2,3,4].map(i =>
      `<span style="height:9px;border-radius:999px;background:${i <= sc ? segColors[i-1] : '#e5eee4'}"></span>`
    ).join('');
    return `
      <div style="margin-bottom:14px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:7px">
          <span style="font-weight:800;font-size:14px;color:#1f1f1c">${escapeHTML(ax.label)}</span>
          <span style="font-weight:700;font-size:11px;color:${meta.color}">${meta.label}</span>
        </div>
        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:5px">${segs}</div>
      </div>`;
  }).join('');

  const cartographieHTML = `
    <section style="margin:18px 24px 0;display:grid;grid-template-columns:1fr 1.1fr;gap:18px">
      <div style="background:white;border:1px solid #e5e6e0;border-radius:18px;padding:22px">
        <div style="font-size:12px;letter-spacing:0.32em;color:#BE401D;font-weight:800;text-transform:uppercase;margin-bottom:6px">Cartographie clinique</div>
        <div style="color:#6b6b6b;font-size:12px;margin-bottom:6px">Échelle 1 (Fragile) à 4 (Solide)</div>
        <div style="display:flex;align-items:center;justify-content:center;min-height:260px">${radarSVG}</div>
      </div>
      <div style="background:white;border:1px solid #e5e6e0;border-radius:18px;padding:22px">
        <div style="font-size:12px;letter-spacing:0.32em;color:#BE401D;font-weight:800;text-transform:uppercase;margin-bottom:14px">Synthèse par axe</div>
        ${axesSegHTML}
      </div>
    </section>`;


  // === PROFIL CLINIQUE OBSERVÉ — 4 CARTES COMPACTES ===
  const pc = data.profil_clinique || {};
  function splitTags(v) {
    if (Array.isArray(v)) return v.filter(Boolean).slice(0, 4);
    if (typeof v === 'string' && v.trim()) return v.split(/[,;•\n]+/).map(s => s.trim()).filter(Boolean).slice(0, 4);
    return [];
  }
  const pcStructure = splitTags(pc.structure || pc.structure_psychique || pc.structure_relationnelle);
  const pcEvents = splitTags(pc.evenements || pc.evenements_structurants);
  const pcResources = splitTags(pc.ressources || pc.ressources_structurantes);
  const pcConflict = pc.conflit_central || pc.conflit || '';

  function profileList(items, fallback) {
    const arr = items.length ? items : fallback;
    return '<ul style="margin:0;padding-left:16px;font-size:12.5px;line-height:1.55;color:#333">' +
      arr.map(x => '<li>' + escapeHTML(x) + '</li>').join('') +
      '</ul>';
  }

  const profilCliniqueHTML = `
    <section style="margin:18px 24px 0;background:white;border:1px solid #e5e6e0;border-radius:18px;padding:24px">
      <div style="font-size:12px;letter-spacing:0.32em;color:#BE401D;font-weight:800;text-transform:uppercase;margin-bottom:16px">Profil clinique observé</div>
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px">
        <div style="border:1px solid #f0c8c2;border-radius:14px;background:#fff;padding:16px">
          <div style="font-size:12px;line-height:1.25;text-transform:uppercase;font-weight:900;color:#BE401D;margin-bottom:10px">Structure psychique et relationnelle</div>
          ${profileList(pcStructure, ['Estime de soi vulnérable','Sensibilité au rejet','Vigilance relationnelle'])}
        </div>
        <div style="border:1px solid #d8cfee;border-radius:14px;background:#fff;padding:16px">
          <div style="font-size:12px;line-height:1.25;text-transform:uppercase;font-weight:900;color:#5B4A8B;margin-bottom:10px">Événements structurants</div>
          ${profileList(pcEvents, ['Événements marquants à préciser','Ruptures ou pertes significatives','Transitions de vie'])}
        </div>
        <div style="border:1px solid #efc88f;border-radius:14px;background:#fff;padding:16px;text-align:center">
          <div style="font-size:12px;line-height:1.25;text-transform:uppercase;font-weight:900;color:#C66A1D;margin-bottom:12px">Conflit central</div>
          <div style="font-size:13px;line-height:1.55;color:#333;font-weight:700">${escapeHTML(pcConflict || 'Besoin de sécurité ↔ peur du rejet')}</div>
        </div>
        <div style="border:1px solid #c9dfbf;border-radius:14px;background:#fff;padding:16px">
          <div style="font-size:12px;line-height:1.25;text-transform:uppercase;font-weight:900;color:#4f8146;margin-bottom:10px">Ressources structurantes</div>
          ${profileList(pcResources, ['Réflexivité','Verbalisation','Soutien relationnel'])}
        </div>
      </div>
    </section>`;

  // === MATRICE PSYCHOSOMATIQUE 6 AXES ===
  const matriceLignes = axesArr.map(ax => {
    const sc = Math.max(1, Math.min(4, Math.round(ax.score || 2)));
    const pillBg = sc === 1 ? '#fde7e8' : sc === 2 ? '#fff0cf' : sc === 3 ? '#e9f3df' : '#dff0e1';
    const pillCol = sc === 1 ? '#c94750' : sc === 2 ? '#be7a17' : sc === 3 ? '#4f8146' : '#2f6f3e';
    return `
      <div style="display:contents">
        <div style="padding:16px 16px;border-right:1px solid #e5e6e0;border-bottom:1px solid #e5e6e0;background:#fff;font-weight:800;font-size:14px;line-height:1.2;display:flex;align-items:center">${escapeHTML(ax.label)}</div>
        <div style="padding:16px 16px;border-right:1px solid #e5e6e0;border-bottom:1px solid #e5e6e0;background:#fff;text-align:center"><span style="display:inline-flex;align-items:center;justify-content:center;height:26px;min-width:50px;border-radius:999px;font-weight:900;font-size:12px;background:${pillBg};color:${pillCol}">${sc}/4</span></div>
        <div style="padding:16px 16px;border-right:1px solid #e5e6e0;border-bottom:1px solid #e5e6e0;background:#fff;font-size:13px;line-height:1.5;color:#333">${escapeHTML(ax.manifestations || ax.obs || '—')}</div>
        <div style="padding:16px 16px;border-bottom:1px solid #e5e6e0;background:#fff;font-size:13px;line-height:1.5;color:#333">${escapeHTML(ax.systemes || '—')}</div>
      </div>`;
  }).join('');

  const matriceHTML = `
    <section style="margin:18px 24px 0;background:white;border:1px solid #e5e6e0;border-radius:18px;padding:24px">
      <div style="font-size:12px;letter-spacing:0.32em;color:#BE401D;font-weight:800;text-transform:uppercase;margin-bottom:16px">Matrice psychosomatique — 6 axes BilanPsy</div>
      <div class="matrix-scroll"><div class="matrix-grid" style="display:grid;grid-template-columns:170px 70px 1fr 1fr;border-top:1px solid #e5e6e0;border-left:1px solid #e5e6e0;overflow:hidden;border-radius:12px">
        <div style="padding:12px 16px;background:#6E6456;color:white;font-weight:900;text-transform:uppercase;font-size:11px;letter-spacing:0.04em;border-right:1px solid rgba(255,255,255,0.15)">Axe</div>
        <div style="padding:12px 16px;background:#6E6456;color:white;font-weight:900;text-transform:uppercase;font-size:11px;letter-spacing:0.04em;border-right:1px solid rgba(255,255,255,0.15)">Score</div>

  // === ANALYSE LINGUISTIQUE IMPLICITE — V3.3 ULTRA COMPACTE ===
  // Format inline avec mini-tags + 1 phrase de synthèse
  // Section secondaire : densité visuelle minimale, lecture optionnelle
  const al = data.analyse_linguistique;

  const analyseLinguistiqueHTML = al && linguTags.length > 0 ? `
    <section style="margin:18px 24px 0;background:#fafaf7;border:1px solid #e5e6e0;border-radius:14px;padding:14px 18px">

      <div style="display:flex;flex-wrap:wrap;gap:6px 14px;margin-bottom:8px">
        ${linguTags.map(t => `

      </div>
      ${al.observations ? `
        <div style="font-size:11.5px;color:#3a4a35;line-height:1.5;font-style:italic;font-family:Georgia,serif;padding-top:8px;border-top:0.5px dashed rgba(0,0,0,0.08)">
          ${escapeHTML(al.observations)}
        </div>` : ''}
    </section>` : '';

  // === MÉCANISMES TRANSDIAGNOSTIQUES (CARDS COMPACTES AVEC BOUCLE COURTE) ===
  // Limité à 5 mécanismes maximum pour préserver le grid (sinon le 5e tombe seul sur la 2e ligne)
  // V3.6 BtC : remplacement des dots numériques (saillance 0-3) par une qualification textuelle
  // wellness-safe ("saillance élevée / modérée / discrète"). La donnée 0-3 reste en backend
  // pour le tri par saillance, mais ne s'affiche jamais.
  const mecanismes = (data.mecanismes_transdiagnostiques || [])
    .slice()
    .sort((a, b) => (b.salience || 0) - (a.salience || 0))
    .slice(0, 5);

  // Mapping saillance numérique → qualification textuelle wellness-safe
  function qualSaillance(s) {
    const n = Math.max(0, Math.min(3, s || 0));
    if (n >= 3) return { label: 'saillance élevée',  color: '#14562e', bg: '#E3ECD9' };
    if (n === 2) return { label: 'saillance modérée', color: '#EFE9DD', bg: '#E3ECD9' };
    return         { label: 'saillance discrète', color: '#6b6b63', bg: '#f0eee9' };
  }

  const mecanismeCards = mecanismes.map(m => {
    const q = qualSaillance(m.salience);
    return `
      <div style="border:1px solid #e5e6e0;border-radius:14px;padding:16px;background:white">
        <div style="font-size:15px;font-weight:900;margin-bottom:8px;color:#1f1f1c">${escapeHTML(m.processus || '')}</div>

  const mecanismesHTML = mecanismes.length ? `

      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px">${mecanismeCards}</div>
    </section>` : '';

  // === HYPOTHÈSES CLINIQUES (V3.5 — couche structurale) ===
  const hypothesesArr = (data.hypotheses_cliniques || []).slice(0, 6);
  const hypothesesHTML = hypothesesArr.length ? `

  const themesCards = themes.map(t => `

  // Card item 9 en pleine largeur (sous le grid des 4 thèmes), seulement si item9_present

  // === ASSEMBLAGE FINAL ===

function printBilanBTB(){
  const inner = document.getElementById('btb-doc').innerHTML;
  const w = window.open('','_blank');

// ========================================================================
// CHARGEMENT DU BILAN DEPUIS L'API
// ========================================================================
async function loadBilan(){
  const params = new URLSearchParams(window.location.search);
  const code = params.get('session');
  if(!code){
    document.getElementById('page-content').innerHTML = '<div class="error-box">Lien invalide — code session manquant.</div>';
    return;
  }
  sessionCode = code;

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ mode: 'get_bilan', sessionCode: code })
    });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const result = await res.json();
    if(!result || !result.btb){
      document.getElementById('page-content').innerHTML = '<div class="error-box">Bilan introuvable. Le lien a peut-etre expire ou est incorrect.</div>';
      return;
    }
    const data = typeof result.btb === 'string' ? JSON.parse(result.btb) : result.btb;
    showBilanBTB(data);
  } catch(err){
    console.error('[bilan-clinique] Erreur:', err);
    document.getElementById('page-content').innerHTML = '<div class="error-box">Erreur de chargement du bilan. Reessayez dans quelques instants.</div>';
  }
}

loadBilan();
</script>
